  <script>
    const titles=['StablePair Hook 与 LP 用户助手','Hook 把部分套利价差留给 LP','每笔交易按价格位置与方向定费','9 月 14 日的基础 APR 快照为 6.44%','StablePair 尚无完整近 30 天均值','收益取决于成交周转和平均费率','成交量不变时，新增资金稀释单位收益','用户通过助手直接持有 Uniswap LP','用户助手围绕投入、持仓和退出','真实脱锚可能超过手续费收益','首版先打通用户自己的 LP 操作'];
    const $=id=>document.getElementById(id);
    const src=i=>`slides/slide-${String(i+1).padStart(2,'0')}.png`;
    let current=0;
    const thumbs=titles.map((title,i)=>{
      const button=document.createElement('button');button.type='button';button.setAttribute('aria-label',`跳到第 ${i+1} 页：${title}`);
      const img=document.createElement('img');img.src=src(i);img.alt='';img.loading='lazy';img.width=1280;img.height=720;
      const label=document.createElement('span');label.textContent=`${String(i+1).padStart(2,'0')} · ${title}`;
      button.append(img,label);button.addEventListener('click',()=>{show(i);$('viewer').scrollIntoView({block:'start',behavior:'instant'});});$('toc').append(button);return button;
    });
    function show(index,updateHash=true){
      current=Math.min(Math.max(index,0),titles.length-1);
      $('slide').src=src(current);$('slide').alt=`第 ${current+1} 页：${titles[current]}`;
      $('count').textContent=`${current+1} / ${titles.length}`;$('slideTitle').textContent=titles[current];
      $('prev').disabled=current===0;$('next').disabled=current===titles.length-1;
      $('original').href=src(current);$('progress').style.width=`${(current+1)/titles.length*100}%`;
      $('error').style.display='none';thumbs.forEach((b,i)=>b.setAttribute('aria-current',String(i===current)));
      if(updateHash)history.replaceState(null,'',`#slide=${current+1}`);
      if(current+1<titles.length){const preload=new Image();preload.src=src(current+1);}
    }
    function fromHash(){const n=Number(new URLSearchParams(location.hash.slice(1)).get('slide'));show(Number.isInteger(n)&&n>0?n-1:0,false);}
    $('prev').addEventListener('click',()=>show(current-1));$('next').addEventListener('click',()=>show(current+1));
    document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowRight'){e.preventDefault();show(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1);}if(e.key==='Home'){e.preventDefault();show(0);}if(e.key==='End'){e.preventDefault();show(titles.length-1);}});
    let touch=null;$('slide').addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
    $('slide').addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)show(current+(dx<0?1:-1));},{passive:true});
    $('slide').addEventListener('error',()=>{$('error').style.display='block';});
    $('fullscreen').hidden=!document.fullscreenEnabled;
    $('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('viewer').requestFullscreen();}catch{$('fullscreen').textContent='全屏不可用';}});
    document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏';});
    window.addEventListener('hashchange',fromHash);fromHash();
  </script>
